services:
  - type: web
    name: smart-disaster-management
    env: java
    region: singapore
    plan: free
    buildCommand: ./mvnw clean package -DskipTests || mvn clean package -DskipTests
    startCommand: java -jar target/smart-disaster-management-0.0.1-SNAPSHOT.jar --spring.profiles.active=h2
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: PORT
        value: "8080"
